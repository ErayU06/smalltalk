<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>SmallTalk Onboarding - Tanışma</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            coral: {
              DEFAULT: '#FF6B4A',
              50: '#FFF5F2',
              100: '#FFE9E3',
              200: '#FFD3C7',
              500: '#FF6B4A',
              600: '#E85535',
              700: '#C23D20',
            },
            navy: {
              DEFAULT: '#1E293B',
              50: '#F8FAFC',
              100: '#F1F5F9',
              200: '#E2E8F0',
              700: '#334155',
              800: '#1E293B',
              900: '#0F172A',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'coral-glow': '0 12px 28px -6px rgba(255, 107, 74, 0.35)',
            'card-soft': '0 2px 10px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.02)',
          }
        }
      }
    }
  </script>
<!-- Custom CSS for clean mobile scroll and iOS touch behaviors -->
<style data-purpose="mobile-layout">
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    /* Hide scrollbar for a native app feel */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen sm:p-4 text-slate-800 antialiased selection:bg-coral-100 selection:text-coral-700">
<!-- BEGIN: PhoneContainer -->
<!-- Target Dimensions: 390px x 844px Mobile Viewport -->
<main class="w-full max-w-[390px] h-[844px] bg-[#FAF8FF] relative flex flex-col overflow-hidden sm:rounded-[44px] shadow-2xl sm:ring-1 sm:ring-black/5" data-purpose="mobile-screen-container">
<!-- BEGIN: TopBar -->
<header class="pt-8 px-6 pb-2 shrink-0 flex flex-col gap-4 bg-[#FAF8FF] z-20" data-purpose="header-navigation">
<!-- Top Row: Back button & Segmented Progress Bar -->
<div class="flex items-center justify-between">
<!-- Back Button -->
<button aria-label="Geri Dön" class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-slate-700 shadow-sm border border-slate-100 active:scale-95 transition-transform" data-purpose="back-button" type="button">
<svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- 3-Step Progress Indicators -->
<nav aria-label="İlerleme Durumu" class="flex items-center gap-1.5" data-purpose="step-progress-indicator">
<!-- Step 1: Active (Coral Pill) -->
<div class="w-10 h-2 bg-coral rounded-full transition-all duration-300"></div>
<!-- Step 2: Inactive -->
<div class="w-6 h-2 bg-[#E1E6F4] rounded-full"></div>
<!-- Step 3: Inactive -->
<div class="w-6 h-2 bg-[#E1E6F4] rounded-full"></div>
</nav>
<!-- Balance spacer for optical balance against back button -->
<div aria-hidden="true" class="w-10 h-10 opacity-0 pointer-events-none"></div>
</div>
<!-- Step Tag & Screen Title -->
<div class="space-y-1.5 mt-1">
<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold tracking-wide bg-[#EAEFFC] text-[#3E5283]" data-purpose="step-tag">
          Adım 1/3 • Tanışma
        </span>
<h1 class="text-[25px] leading-tight font-extrabold text-[#111928] tracking-tight">
          Önce seni biraz tanıyalım
        </h1>
<p class="text-[13px] leading-snug text-slate-500 font-medium">
          Sana en uygun sohbetleri ve seviyeyi ayarlayabilmemiz için dillerini seç.
        </p>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: ScrollableContent -->
<div class="flex-1 overflow-y-auto px-6 pt-3 pb-28 space-y-6 no-scrollbar" data-purpose="scrollable-selection-body">
<!-- BEGIN: SectionNativeLanguage -->
<section aria-labelledby="heading-native-lang" class="space-y-2.5">
<h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-500" id="heading-native-lang">
          ANA DİLİM
        </h2>
<!-- Interactive Chip Grid for Native Language -->
<div aria-label="Ana dil seçimi" class="flex flex-wrap gap-2" role="radiogroup">
<!-- Turkish (Selected by default) -->
<button aria-checked="true" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-full border-2 border-coral bg-coral-50/70 text-slate-900 font-bold text-sm shadow-xs transition-all" role="radio" type="button">
<span class="text-base leading-none">🇹🇷</span>
<span>Türkçe</span>
<svg class="w-4 h-4 text-coral ml-0.5 stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- English -->
<button aria-checked="false" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-full border border-slate-200/90 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-sm transition-all active:scale-95" role="radio" type="button">
<span class="text-base leading-none">🇬🇧</span>
<span>İngilizce</span>
</button>
<!-- German -->
<button aria-checked="false" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-full border border-slate-200/90 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-sm transition-all active:scale-95" role="radio" type="button">
<span class="text-base leading-none">🇩🇪</span>
<span>Almanca</span>
</button>
<!-- French -->
<button aria-checked="false" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-full border border-slate-200/90 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-sm transition-all active:scale-95" role="radio" type="button">
<span class="text-base leading-none">🇫🇷</span>
<span>Fransızca</span>
</button>
<!-- Russian -->
<button aria-checked="false" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-full border border-slate-200/90 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-sm transition-all active:scale-95" role="radio" type="button">
<span class="text-base leading-none">🇷🇺</span>
<span>Rusça</span>
</button>
<!-- Chinese -->
<button aria-checked="false" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-full border border-slate-200/90 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-sm transition-all active:scale-95" role="radio" type="button">
<span class="text-base leading-none">🇨🇳</span>
<span>Çince</span>
</button>
<!-- Korean -->
<button aria-checked="false" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-full border border-slate-200/90 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-sm transition-all active:scale-95" role="radio" type="button">
<span class="text-base leading-none">🇰🇷</span>
<span>Korece</span>
</button>
</div>
</section>
<!-- END: SectionNativeLanguage -->
<!-- BEGIN: SectionTargetLanguage -->
<section aria-labelledby="heading-practice-lang" class="space-y-2.5">
<h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-500" id="heading-practice-lang">
          PRATİK ETMEK İSTEDİĞİM DİL
        </h2>
<!-- Grid of Language Cards -->
<div aria-label="Pratik dili seçimi" class="grid grid-cols-2 gap-2.5" role="radiogroup">
<!-- English (Selected) -->
<button aria-checked="true" class="flex items-center gap-2.5 p-3 rounded-2xl bg-white border-2 border-coral shadow-sm text-left transition-all relative overflow-hidden" role="radio" type="button">
<div class="w-9 h-9 rounded-xl bg-slate-900 text-white flex items-center justify-center font-extrabold text-xs tracking-wider shrink-0 shadow-xs">
              EN
            </div>
<div class="min-w-0 flex-1">
<span class="block text-sm font-extrabold text-slate-900 truncate">İngilizce</span>
<span class="block text-[11px] font-medium text-slate-500 truncate">🇬🇧 UK &amp; US</span>
</div>
</button>
<!-- German -->
<button aria-checked="false" class="flex items-center gap-2.5 p-3 rounded-2xl bg-white border border-slate-200/90 hover:border-slate-300 shadow-sm text-left transition-all active:scale-98" role="radio" type="button">
<div class="w-9 h-9 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center font-extrabold text-xs tracking-wider shrink-0">
              DE
            </div>
<div class="min-w-0 flex-1">
<span class="block text-sm font-bold text-slate-800 truncate">Almanca</span>
<span class="block text-[11px] font-medium text-slate-500 truncate">🇩🇪 Deutsch</span>
</div>
</button>
<!-- French -->
<button aria-checked="false" class="flex items-center gap-2.5 p-3 rounded-2xl bg-white border border-slate-200/90 hover:border-slate-300 shadow-sm text-left transition-all active:scale-98" role="radio" type="button">
<div class="w-9 h-9 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center font-extrabold text-xs tracking-wider shrink-0">
              FR
            </div>
<div class="min-w-0 flex-1">
<span class="block text-sm font-bold text-slate-800 truncate">Fransızca</span>
<span class="block text-[11px] font-medium text-slate-500 truncate">🇫🇷 Français</span>
</div>
</button>
<!-- Russian -->
<button aria-checked="false" class="flex items-center gap-2.5 p-3 rounded-2xl bg-white border border-slate-200/90 hover:border-slate-300 shadow-sm text-left transition-all active:scale-98" role="radio" type="button">
<div class="w-9 h-9 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center font-extrabold text-xs tracking-wider shrink-0">
              RU
            </div>
<div class="min-w-0 flex-1">
<span class="block text-sm font-bold text-slate-800 truncate">Rusça</span>
<span class="block text-[11px] font-medium text-slate-500 truncate">🇷🇺 Русский</span>
</div>
</button>
<!-- Chinese -->
<button aria-checked="false" class="flex items-center gap-2.5 p-3 rounded-2xl bg-white border border-slate-200/90 hover:border-slate-300 shadow-sm text-left transition-all active:scale-98" role="radio" type="button">
<div class="w-9 h-9 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center font-extrabold text-xs tracking-wider shrink-0">
              CN
            </div>
<div class="min-w-0 flex-1">
<span class="block text-sm font-bold text-slate-800 truncate">Çince</span>
<span class="block text-[11px] font-medium text-slate-500 truncate">🇨🇳 中文</span>
</div>
</button>
<!-- Korean -->
<button aria-checked="false" class="flex items-center gap-2.5 p-3 rounded-2xl bg-white border border-slate-200/90 hover:border-slate-300 shadow-sm text-left transition-all active:scale-98" role="radio" type="button">
<div class="w-9 h-9 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center font-extrabold text-xs tracking-wider shrink-0">
              KR
            </div>
<div class="min-w-0 flex-1">
<span class="block text-sm font-bold text-slate-800 truncate">Korece</span>
<span class="block text-[11px] font-medium text-slate-500 truncate">🇰🇷 한국어</span>
</div>
</button>
</div>
</section>
<!-- END: SectionTargetLanguage -->
<!-- BEGIN: SectionChallenges -->
<section aria-labelledby="heading-challenges" class="space-y-2.5">
<h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-500" id="heading-challenges">
          KONUŞURKEN EN ÇOK NE ZORLUYOR?
        </h2>
<!-- Challenge Option Cards -->
<div aria-label="Zorluk seçimi" class="space-y-2.5" role="radiogroup">
<!-- Option 1: Selected with coral left accent and filled checked radio -->
<label class="relative flex items-center justify-between p-4 rounded-2xl bg-white border border-coral/30 shadow-card-soft cursor-pointer transition-all overflow-hidden">
<!-- Left coral indicator stripe -->
<div class="absolute left-0 top-0 bottom-0 w-1.5 bg-coral rounded-l-2xl"></div>
<span class="text-sm font-bold text-slate-900 pr-3 leading-snug pl-1.5">
              Kelime biliyorum ama konuşurken panikliyorum
            </span>
<input checked="" class="hidden" name="challenge" type="radio"/>
<!-- Custom Checked Circle -->
<div class="w-6 h-6 rounded-full bg-coral flex items-center justify-center shrink-0 text-white shadow-xs">
<svg class="w-3.5 h-3.5 stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</label>
<!-- Option 2: Unselected -->
<label class="flex items-center justify-between p-4 rounded-2xl bg-white border border-slate-100 hover:border-slate-200 shadow-card-soft cursor-pointer transition-all active:scale-[0.99]">
<span class="text-sm font-semibold text-slate-700 pr-3 leading-snug">
              Ne diyeceğimi bilemiyorum, sohbet tıkanıyor
            </span>
<input class="hidden" name="challenge" type="radio"/>
<!-- Unchecked Soft Radio -->
<div class="w-6 h-6 rounded-full bg-slate-100 border border-slate-200/80 shrink-0"></div>
</label>
<!-- Option 3: Unselected -->
<label class="flex items-center justify-between p-4 rounded-2xl bg-white border border-slate-100 hover:border-slate-200 shadow-card-soft cursor-pointer transition-all active:scale-[0.99]">
<span class="text-sm font-semibold text-slate-700 pr-3 leading-snug">
              Telaffuzum yüzünden çekiniyorum
            </span>
<input class="hidden" name="challenge" type="radio"/>
<!-- Unchecked Soft Radio -->
<div class="w-6 h-6 rounded-full bg-slate-100 border border-slate-200/80 shrink-0"></div>
</label>
<!-- Option 4: Unselected -->
<label class="flex items-center justify-between p-4 rounded-2xl bg-white border border-slate-100 hover:border-slate-200 shadow-card-soft cursor-pointer transition-all active:scale-[0.99]">
<span class="text-sm font-semibold text-slate-700 pr-3 leading-snug">
              Hızlı konuşunca karşımdakini kaçırıyorum
            </span>
<input class="hidden" name="challenge" type="radio"/>
<!-- Unchecked Soft Radio -->
<div class="w-6 h-6 rounded-full bg-slate-100 border border-slate-200/80 shrink-0"></div>
</label>
</div>
</section>
<!-- END: SectionChallenges -->
</div>
<!-- END: ScrollableContent -->
<!-- BEGIN: StickyBottomCTA -->
<footer class="absolute bottom-0 inset-x-0 p-6 pt-6 bg-gradient-to-t from-[#FAF8FF] via-[#FAF8FF]/95 to-transparent z-30" data-purpose="primary-action-container">
<button class="w-full h-14 bg-coral hover:bg-coral-600 active:scale-[0.98] text-white font-extrabold text-base rounded-2xl shadow-coral-glow flex items-center justify-center gap-2 transition-all duration-200" type="button">
<span>Devam Et</span>
<svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</footer>
<!-- END: StickyBottomCTA -->
</main>
<!-- END: PhoneContainer -->
</body></html>
